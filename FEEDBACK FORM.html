
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Feedback Form</title>

    <style>

        /* ==============================
           GENERAL STYLING
        =============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dfe8df;
            color: #35433a;
            line-height: 1.6;
        }


        /* ==============================
           HEADER
        =============================== */

        header {
            background-color: #8fae98;
            color: white;
            text-align: center;
            padding: 30px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }


        /* ==============================
           FORM CONTAINER
        =============================== */

        main {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .form-container {
            background-color: #fffdf8;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(50, 70, 55, 0.20);
        }

        .form-container h2 {
            text-align: center;
            color: #52705c;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #68736b;
            margin-bottom: 25px;
        }


        /* ==============================
           FORM GROUP
        =============================== */

        .form-group {
            margin-bottom: 20px;
        }


        /* ==============================
           LABELS
        =============================== */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .required {
            color: #b05252;
        }


        /* ==============================
           INPUT FIELDS
        =============================== */

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {

            width: 100%;
            padding: 11px;

            border: 1px solid #b9c8bc;
            border-radius: 5px;

            font-size: 15px;

            background-color: #ffffff;
            color: #35433a;
        }


        /* Input focus effect */

        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #71947b;

            box-shadow:
                0 0 4px rgba(113, 148, 123, 0.35);
        }


        /* ==============================
           RADIO BUTTONS & CHECKBOXES
        =============================== */

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
        }

        .option input {
            width: auto;
        }


        /* ==============================
           TEXTAREA
        =============================== */

        textarea {
            min-height: 120px;
            resize: vertical;
        }


        /* ==============================
           BUTTONS
        =============================== */

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit-button {
            background-color: #6f9278;
            color: white;
        }

        .reset-button {
            background-color: #9ca89f;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }


        /* ==============================
           FOOTER
        =============================== */

        footer {
            background-color: #8fae98;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }


        /* ==============================
           RESPONSIVE DESIGN
        =============================== */

        @media (max-width: 600px) {

            .form-container {
                padding: 20px;
            }

            .options {
                flex-direction: column;
                gap: 8px;
            }

            .buttons {
                flex-direction: column;
            }

            header h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <h1>
            Student Feedback Form
        </h1>

        <p>
            We value your feedback
        </p>

    </header>


    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main>

        <section class="form-container">

            <h2>
                Course Feedback
            </h2>

            <p class="description">
                Please fill in the form below and share your valuable
                feedback with us.
            </p>


            <!-- ==============================
                 FORM
            =============================== -->

            <form action="#" method="post">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">

                        Full Name
                        <span class="required">*</span>

                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="3"
                        maxlength="50"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email Address
                        <span class="required">*</span>

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        pattern="[0-9]{10}"
                        title="Please enter exactly 10 digits">

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="17"
                        max="100"
                        placeholder="Enter your age">

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        Date of Feedback
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date">

                </div>


                <!-- COURSE -->

                <div class="form-group">

                    <label for="course">

                        Select Course
                        <span class="required">*</span>

                    </label>

                    <select
                        id="course"
                        name="course"
                        required>

                        <option value="">
                            -- Select Course --
                        </option>

                        <option value="web">
                            Web and UX Design
                        </option>

                        <option value="programming">
                            Programming
                        </option>

                        <option value="database">
                            Database Management
                        </option>

                        <option value="datascience">
                            Data Science
                        </option>

                        <option value="ai">
                            Artificial Intelligence
                        </option>

                    </select>

                </div>


                <!-- RATING -->

                <div class="form-group">

                    <label>

                        Overall Rating
                        <span class="required">*</span>

                    </label>


                    <div class="options">

                        <label class="option">

                            <input
                                type="radio"
                                name="rating"
                                value="excellent"
                                required>

                            Excellent

                        </label>


                        <label class="option">

                            <input
                                type="radio"
                                name="rating"
                                value="good">

                            Good

                        </label>


                        <label class="option">

                            <input
                                type="radio"
                                name="rating"
                                value="average">

                            Average

                        </label>


                        <label class="option">

                            <input
                                type="radio"
                                name="rating"
                                value="poor">

                            Poor

                        </label>

                    </div>

                </div>


                <!-- FEATURES LIKED -->

                <div class="form-group">

                    <label>
                        What did you like about the course?
                    </label>


                    <div class="options">

                        <label class="option">

                            <input
                                type="checkbox"
                                name="liked"
                                value="content">

                            Course Content

                        </label>


                        <label class="option">

                            <input
                                type="checkbox"
                                name="liked"
                                value="teaching">

                            Teaching

                        </label>


                        <label class="option">

                            <input
                                type="checkbox"
                                name="liked"
                                value="materials">

                            Learning Materials

                        </label>


                        <label class="option">

                            <input
                                type="checkbox"
                                name="liked"
                                value="interactive-classes">

                            Interactive Classes

                        </label>

                    </div>

                </div>


                <!-- RECOMMENDATION -->

                <div class="form-group">

                    <label>

                        Would you recommend this course?
                        <span class="required">*</span>

                    </label>


                    <div class="options">

                        <label class="option">

                            <input
                                type="radio"
                                name="recommend"
                                value="yes"
                                required>

                            Yes

                        </label>


                        <label class="option">

                            <input
                                type="radio"
                                name="recommend"
                                value="no">

                            No

                        </label>


                        <label class="option">

                            <input
                                type="radio"
                                name="recommend"
                                value="maybe">

                            Maybe

                        </label>

                    </div>

                </div>


                <!-- FEEDBACK -->

                <div class="form-group">

                    <label for="feedback">

                        Your Feedback
                        <span class="required">*</span>

                    </label>

                    <textarea
                        id="feedback"
                        name="feedback"
                        placeholder="Write your feedback here..."
                        minlength="10"
                        maxlength="500"
                        required></textarea>

                </div>


                <!-- SUGGESTION -->

                <div class="form-group">

                    <label for="suggestion">

                        Suggestions for Improvement

                    </label>

                    <textarea
                        id="suggestion"
                        name="suggestion"
                        placeholder="Enter your suggestions..."
                        maxlength="500"></textarea>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="submit-button">

                        Submit Feedback

                    </button>


                    <button
                        type="reset"
                        class="reset-button">

                        Reset Form

                    </button>

                </div>


            </form>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <p>
            &copy; 2026 Student Feedback System
        </p>

    </footer>


</body>

</html>
