<!DOCTYPE html>
<html>
<head>
    <title>Display Message</title>
</head>
<body>
    <h2>Welcome Message</h2>
    <button onclick="show()">Click Me</button>
    <p id="output"></p>

    <script>
        function show() {
            document.getElementById("output").innerHTML =
                "Hi everyone this is a warm welcome to all of you. I am glad to have you here. Let's make the most of our time together!";
        }
    </script>
</body>
</html>
