<!DOCTYPE html>
<html>
<head><title>Registration Form</title></head>
<body>
<h2>Student Registration</h2>
<form>
Name: <input type="text"><br><br>
Email: <input type="email"><br><br>
Password: <input type="password"><br><br>
Gender:
<input type="radio" name="g">Male
<input type="radio" name="g">Female<br><br>
Date of Birth: <input type="date"><br><br>
Mobile: <input type="tel"><br><br>
Address:<br><textarea rows="4" cols="30"></textarea><br><br>
Department:
<select><option>CSE</option><option>ECE</option><option>EEE</option></select><br><br>
Hobbies:
<input type="checkbox">Sports
<input type="checkbox">Music
<input type="checkbox">Reading<br><br>
<input type="submit">
<input type="reset">
</form>
</body>
</html>
