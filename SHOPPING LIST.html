<!DOCTYPE html>
<html>
<head>
    <title>Shopping List</title>

    <style>
        body {
            background-color: #F5E6D3;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            color: #5C4033;
        }

        ul {
            width: 300px;
            margin: 20px auto;
            padding: 20px 40px;
            background-color: #FFF8F0;
            border: 2px solid #C8A98A;
            border-radius: 1px;
        }

        li {
            padding: 10px;
            color: #6B4F3A;
            font-size: 18px;
        }

        li:hover {
            background-color: #E8D3C0;
        }
    </style>
</head>

<body>

    <h2>Shopping List</h2>

    <ul>
        <li>Rice</li>
        <li>Milk</li>
        <li>Bread</li>
        <li>Fruits</li>
        <li>Vegetables</li>
        <li>Eggs</li>
        <li>Butter</li>
        <li>Cheese</li>
        <li>chocolates</li>
    </ul>

</body>
</html>
