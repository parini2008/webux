<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Element Manipulation</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #heading {
            color: black;
        }

        #message {
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1 id="heading">Welcome to JavaScript</h1>

    <p id="message">
        This is the original HTML content.
    </p>

    <button onclick="changeContent()">
        Change Content
    </button>

    <button onclick="changeStyle()">
        Change Style
    </button>

    <button onclick="resetContent()">
        Reset
    </button>


    <script>

        // Function to change HTML content
        function changeContent() {

            document.getElementById("heading").innerHTML =
                "JavaScript Content Updated!";

            document.getElementById("message").innerHTML =
                "The HTML content has been changed using JavaScript.";
        }


        // Function to change HTML style
        function changeStyle() {

            document.getElementById("heading").style.color = "blue";

            document.getElementById("message").style.fontSize = "25px";

            document.getElementById("message").style.backgroundColor =
                "lightyellow";
        }


        // Function to reset the page
        function resetContent() {

            document.getElementById("heading").innerHTML =
                "Welcome to JavaScript";

            document.getElementById("message").innerHTML =
                "This is the original HTML content.";

            document.getElementById("heading").style.color = "black";

            document.getElementById("message").style.fontSize = "18px";

            document.getElementById("message").style.backgroundColor =
                "white";
        }

    </script>

</body>
</html>
