<!DOCTYPE html>
<html>
<head>
    <title>Check color</title>
</head>
<body>
    <h2 id="text">Hellowwww</h2>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.getElementById("text").style.color = "brown";
        }
    </script>
</body>
</html>
